<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="05-roofline-title 05-roofline-desc" id="d-05-roofline-root">
        <title id="05-roofline-title">A100 roofline: why tiling matters</title>
        <desc id="05-roofline-desc">Log-log roofline for an A100. Achievable GFLOPS rise along the memory-bandwidth slope of 1555 GB/s until the ridge at 12.5 FLOP per byte, then flatten at the 19,500 GFLOPS FP32 peak; a dashed tensor-core roof sits at 156,000. The naive matrix multiply sits on the slope at 0.25 FLOP/B and 389 GFLOPS; 16 by 16 tiling moves it to 4 FLOP/B and 6,220 GFLOPS, still memory-bound.</desc>
        <defs>
      <style>#d-05-roofline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-05-roofline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-05-roofline-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-05-roofline-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-05-roofline-05-roofline-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#d-05-roofline-05-roofline-dots)" opacity="0.55"/>
        <line x1="88" y1="356.0" x2="600" y2="356.0" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="360.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">10</text>
        <line x1="88" y1="296.0" x2="600" y2="296.0" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="300.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">100</text>
        <line x1="88" y1="236.0" x2="600" y2="236.0" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="240.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1k</text>
        <line x1="88" y1="176.0" x2="600" y2="176.0" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="180.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">10k</text>
        <line x1="88" y1="116.0" x2="600" y2="116.0" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="120.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">100k</text>
        <line x1="88" y1="56.0" x2="600" y2="56.0" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="80" y="60.0" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">1M</text>
        <line x1="88.0" y1="56" x2="88.0" y2="356" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="88.0" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0.1</text>
        <line x1="216.0" y1="56" x2="216.0" y2="356" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="216.0" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1</text>
        <line x1="344.0" y1="56" x2="344.0" y2="356" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="344.0" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">10</text>
        <line x1="472.0" y1="56" x2="472.0" y2="356" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="472.0" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">100</text>
        <line x1="600.0" y1="56" x2="600.0" y2="356" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="600.0" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1000</text>
        <line x1="88" y1="356" x2="600" y2="356" stroke="#2d3142" stroke-opacity="0.25" stroke-width="1"/>
        <line x1="88" y1="56" x2="88" y2="356" stroke="#2d3142" stroke-opacity="0.25" stroke-width="1"/>
        <text x="344" y="396" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ARITHMETIC INTENSITY  (FLOP / BYTE, LOG)</text>
        <text x="24" y="206" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em" transform="rotate(-90 24 206)">GFLOPS (LOG)</text>
        <polyline points="356.6,158.6 472.2,104.4 600.0,104.4" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="596.0" y="96.41252409873229" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">tensor cores · 156,000</text>
        <polyline points="88.0,284.5 356.6,158.6 600.0,158.6" fill="none" stroke="#2d3142" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="596.0" y="174.5979233182489" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">FP32 peak · 19,500</text>
        <text x="187.6" y="229.8" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" transform="rotate(-25.1 187.6 229.8)">HBM · 1555 GB/s</text>
        <line x1="356.6" y1="158.6" x2="356.6" y2="356" stroke="#4f5d75" stroke-width="1" stroke-dasharray="2 3"/>
        <text x="362.5829399039567" y="348" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">ridge 12.5</text>
        <line x1="143.9" y1="256.6" x2="286.1" y2="193.4" stroke="#bf4520" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="138.9" cy="260.6" r="5" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.5"/>
        <text x="148.9363211100208" y="278.60302392045753" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="600">naive matmul</text>
        <text x="148.9363211100208" y="292.60302392045753" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">0.25 FLOP/B · 389</text>
        <circle cx="293.1" cy="188.4" r="6" fill="#bf4520" stroke="#2d3142" stroke-width="1"/>
        <text x="305.0636788899792" y="206.3725769185509" fill="#bf4520" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="600">16x16 tiled</text>
        <text x="305.0636788899792" y="220.3725769185509" fill="#bf4520" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">4 FLOP/B · 6,220</text>
        <text x="24" y="428" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Left of the ridge, only fewer bytes per FLOP moves you up.</text>
      </svg>
