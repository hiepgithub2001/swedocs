      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-14-sparse-formats-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-14-sparse-formats-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-14-sparse-formats-root .diagram-container { overflow-x: visible; }</style>
