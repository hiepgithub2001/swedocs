<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="07-isolation-levels-title 07-isolation-levels-desc" id="d-07-isolation-levels-root">
        <title id="07-isolation-levels-title">Which isolation level prevents what</title>
        <desc id="07-isolation-levels-desc">Matrix of isolation levels against race conditions. Read uncommitted prevents only dirty writes. Read committed adds dirty reads. Snapshot isolation adds read skew, prevents lost updates only in some databases, and allows write skew and phantom-driven write skew. Serializable prevents all six.</desc>
