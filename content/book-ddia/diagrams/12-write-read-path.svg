        <text x="196" y="156" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Event log</text>
        <text x="196" y="176" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">system of record · ordered</text>
