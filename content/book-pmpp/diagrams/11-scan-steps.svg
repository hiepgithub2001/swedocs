<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="11-scan-steps-title 11-scan-steps-desc" id="d-11-scan-steps-root">
        <title id="11-scan-steps-title">Scan: work efficiency under limited hardware</title>
        <desc id="11-scan-steps-desc">The book&#x27;s step estimates for scanning 1024 elements with 32 execution units: sequential scan takes 1024 steps, Kogge-Stone about 320 because it does N log N work, Brent-Kung about 74 including divergent tails, and the three-phase coarsened scan with 64 threads about 72.</desc>
        <defs>
      <style>#d-11-scan-steps-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-11-scan-steps-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-11-scan-steps-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-11-scan-steps-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-11-scan-steps-11-scan-steps-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#d-11-scan-steps-11-scan-steps-dots)" opacity="0.55"/>
        <line x1="210.0" y1="48" x2="210.0" y2="296" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="210.0" y="312" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">0</text>
        <line x1="297.5" y1="48" x2="297.5" y2="296" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="297.5" y="312" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">256</text>
        <line x1="385.0" y1="48" x2="385.0" y2="296" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="385.0" y="312" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">512</text>
        <line x1="472.5" y1="48" x2="472.5" y2="296" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="472.5" y="312" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">768</text>
        <line x1="560.0" y1="48" x2="560.0" y2="296" stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8"/>
        <text x="560.0" y="312" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1024</text>
        <text x="196" y="70" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="end">Sequential</text>
        <text x="196" y="85" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">N steps, N-1 adds</text>
        <rect x="210" y="56" width="350.0" height="28" fill="#f5f5f5"/>
        <rect x="210" y="56" width="350.0" height="28" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="568.0" y="75" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">1024</text>
        <text x="196" y="134" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="end">Kogge-Stone</text>
        <text x="196" y="149" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">N·log2N work / 32 units</text>
        <rect x="210" y="120" width="109.4" height="28" fill="#f5f5f5"/>
        <rect x="210" y="120" width="109.4" height="28" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="327.375" y="139" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">320</text>
        <text x="196" y="198" fill="#2d3142" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="end">Brent-Kung</text>
        <text x="196" y="213" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">2N-2-log2N / 32, +divergence</text>
