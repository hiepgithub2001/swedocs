<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="09-address-space-title 09-address-space-desc" id="d-09-address-space-root">
        <title id="09-address-space-title">A Linux process address space</title>
        <desc id="09-address-space-desc">Virtual address space of a 64-bit Linux process: read-only code at 0x400000, read/write data and bss, the heap growing up, the memory-mapped region for shared libraries, the user stack growing down, and kernel memory at the top.</desc>
        <defs>
      <style>#d-09-address-space-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-09-address-space-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-09-address-space-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-09-address-space-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-09-address-space-09-address-space-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#d-09-address-space-09-address-space-dots)" opacity="0.55"/>
        <text x="24" y="52" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">HIGH ADDR</text>
        <line x1="64" y1="64" x2="64" y2="448" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <polygon points="60,64 68,64 64,56" fill="#4f5d75"/>
        <text x="24" y="472" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LOW ADDR</text>
        <line x1="96" y1="64" x2="476" y2="64" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="96" y="64" width="380" height="64" fill="#ececec"/>
        <line x1="96" y1="128" x2="476" y2="128" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="108" y="90" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">TOP</text>
        <text x="196" y="92" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Kernel memory</text>
        <text x="196" y="112" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">invisible to user code</text>
        <rect x="96" y="128" width="380" height="64" fill="#ffffff"/>
        <line x1="96" y1="192" x2="476" y2="192" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="196" y="156" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">User stack</text>
        <text x="196" y="176" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">created at run time · grows ↓</text>
        <rect x="96" y="192" width="380" height="64" fill="#ffffff"/>
        <line x1="96" y1="256" x2="476" y2="256" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="196" y="220" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Memory-mapped region</text>
        <text x="196" y="240" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">shared libraries · mmap</text>
        <rect x="96" y="256" width="380" height="64" fill="#bf4520" fill-opacity="0.08"/>
        <rect x="96" y="256" width="380" height="64" fill="none" stroke="#bf4520" stroke-width="1"/>
        <text x="108" y="282" fill="#bf4520" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" letter-spacing="0.10em">brk</text>
        <text x="196" y="284" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Run-time heap</text>
        <text x="196" y="304" fill="#bf4520" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">malloc · grows ↑</text>
        <rect x="96" y="320" width="380" height="64" fill="#f5f5f5"/>
        <line x1="96" y1="384" x2="476" y2="384" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="196" y="348" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Read/write segment</text>
        <text x="196" y="368" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">.data · .bss</text>
        <rect x="96" y="384" width="380" height="64" fill="#f5f5f5"/>
        <line x1="96" y1="448" x2="476" y2="448" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="108" y="410" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">0x400000</text>
        <text x="196" y="412" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Read-only segment</text>
        <text x="196" y="432" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">.init · .text · .rodata</text>
        <path d="M 488 328 H 496 V 440 H 488" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <text x="504" y="388" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">EXECUTABLE</text>
        <text x="24" y="512" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Gaps between areas cost nothing: pages that belong to no area do not exist.</text>
      </svg>
