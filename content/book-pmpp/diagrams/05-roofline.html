<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 640px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Roofline · PMPP ch. 5</p>
    <h1>A100 roofline: why tiling matters</h1>

      <svg viewBox="0 0 640 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="05-roofline-title 05-roofline-desc">
        <title id="05-roofline-title">A100 roofline: why tiling matters</title>
        <desc id="05-roofline-desc">Log-log roofline for an A100. Achievable GFLOPS rise along the memory-bandwidth slope of 1555 GB/s until the ridge at 12.5 FLOP per byte, then flatten at the 19,500 GFLOPS FP32 peak; a dashed tensor-core roof sits at 156,000. The naive matrix multiply sits on the slope at 0.25 FLOP/B and 389 GFLOPS; 16 by 16 tiling moves it to 4 FLOP/B and 6,220 GFLOPS, still memory-bound.</desc>

          <pattern id="05-roofline-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#05-roofline-dots)" opacity="0.55"/>

        <line x1="344.0" y1="56" x2="344.0" y2="356" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

        <line x1="472.0" y1="56" x2="472.0" y2="356" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

        <line x1="143.9" y1="256.6" x2="286.1" y2="193.4" stroke="#bf4520" stroke-width="1" stroke-dasharray="3 3"/>
        <circle cx="138.9" cy="260.6" r="5" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.5"/>
        <text x="148.9363211100208" y="278.60302392045753" fill="#2d3142" font-size="11" font-family="'Geist', system-ui, sans-serif" font-weight="600">naive matmul</text>
        <text x="148.9363211100208" y="292.60302392045753" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace">0.25 FLOP/B · 389</text>
        <circle cx="293.1" cy="188.4" r="6" fill="#bf4520" stroke="#2d3142" stroke-width="1"/>

        <text x="24" y="428" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Left of the ridge, only fewer bytes per FLOP moves you up.</text>
      </svg>

  </div>
