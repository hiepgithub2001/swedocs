<svg viewBox="0 0 640 398" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="14-sparse-formats-title 14-sparse-formats-desc" id="d-14-sparse-formats-root">
        <title id="14-sparse-formats-title">Sparse formats: what each one buys</title>
        <desc id="14-sparse-formats-desc">Matrix of five sparse formats against five criteria. COO: partial space efficiency, flexible, partial access, coalesced, balanced but needs atomics. CSR: compact, inflexible, row access only, uncoalesced, unbalanced. ELL: padding wastes space, partly flexible, full access, coalesced, unbalanced. Hybrid ELL-COO: partial space, flexible, partial access, coalesced, partly balanced. JDS: compact, inflexible, row access, coalesced but unaligned, balanced.</desc>
