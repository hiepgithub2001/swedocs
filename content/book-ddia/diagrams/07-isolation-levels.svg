      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-07-isolation-levels-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-07-isolation-levels-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-07-isolation-levels-root .diagram-container { overflow-x: visible; }</style>
