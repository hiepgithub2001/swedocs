<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="description" content="A software-engineering knowledge base, read as EPUB.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="swedocs">
<title>swedocs</title>
<script>
  // Every other URL in this app is relative, and the deep route /read/<book>/…
  // is served by this same file (404.html is a copy of it). Without a <base>
  // the browser would resolve ./app.js against the route's own depth. Computed
  // rather than hardcoded so the app works at a domain root, under /swedocs/,
  // or from a local server, with no build step.
  (function () {
    var p = location.pathname;
    var i = p.indexOf('/read/');
    var base = i >= 0 ? p.slice(0, i + 1) : p.replace(/[^/]*$/, '');
    document.write('<base href="' + base + '">');
  })();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header id="bar" hidden>
  <button id="to-shelf" class="icon" title="Library" aria-label="Library">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.6 1 -3.4 14.6 -3.6-1z"/></svg>
  </button>
  <div id="where">
    <strong id="where-book"></strong>
    <span id="where-chapter"></span>
  </div>
  <button id="open-toc" class="icon" title="Contents" aria-label="Contents" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h10v2H4z"/></svg>
  </button>
  <button id="open-search" class="icon" title="Search" aria-label="Search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.2 12.6l4.1 4.1 1.4-1.4-4.1-4.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
  </button>
  <button id="open-settings" class="icon" title="Display settings" aria-label="Display settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h12v2H6zM4 11h16v2H4zM8 17h8v2H8z"/></svg>
  </button>
</header>

<main id="main" tabindex="-1">
  <section id="shelf" hidden></section>

  <section id="reader" hidden>
    <div id="view-host"></div>
    <button id="page-prev" class="edge" aria-label="Previous page"></button>
    <button id="page-next" class="edge" aria-label="Next page"></button>
    <footer id="progress" hidden>
      <div id="progress-track"><div id="progress-fill"></div></div>
      <span id="progress-label"></span>
    </footer>
  </section>

  <p id="status" role="status"></p>
</main>

<aside id="panel" hidden aria-label="Contents and search">
  <div id="panel-head">
    <input id="search-input" type="search" placeholder="Search sections…" autocomplete="off" spellcheck="false">
    <button id="panel-close" class="icon" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
    </button>
  </div>
  <nav id="panel-body"></nav>
</aside>

<dialog id="zoom" aria-label="Diagram">
  <div id="zoom-stage">
    <div id="zoom-canvas"></div>
  </div>
  <div id="zoom-bar">
    <button id="zoom-out" class="icon" type="button" title="Zoom out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5z"/></svg>
    </button>
    <output id="zoom-level">100%</output>
    <button id="zoom-in" class="icon" type="button" title="Zoom in" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
    <button id="zoom-reset" type="button">Fit</button>
    <p id="zoom-caption" hidden></p>
    <button id="zoom-close" class="icon" type="button" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"/></svg>
    </button>
  </div>
</dialog>

<dialog id="settings">
  <form method="dialog">
    <h2>Display</h2>

    <fieldset id="set-theme">
      <legend>Theme</legend>
      <label><input type="radio" name="theme" value="auto"> Match system</label>
      <label><input type="radio" name="theme" value="light"> Light</label>
      <label><input type="radio" name="theme" value="dark"> Dark</label>
    </fieldset>

    <label class="range">Text size <output id="out-size"></output>
      <input id="set-size" type="range" min="80" max="180" step="5">
    </label>

    <label class="range">Line height <output id="out-leading"></output>
      <input id="set-leading" type="range" min="12" max="22" step="1">
    </label>

    <fieldset id="set-flow">
      <legend>Layout</legend>
      <label><input type="radio" name="flow" value="paginated"> Pages</label>
      <label><input type="radio" name="flow" value="scrolled"> Scroll</label>
    </fieldset>

    <p id="offline-row">
      <button id="save-offline" type="button">Save this book offline</button>
      <span id="offline-state"></span>
    </p>

    <menu><button value="close">Done</button></menu>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
