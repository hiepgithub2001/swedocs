<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="05-memory-hierarchy-title 05-memory-hierarchy-desc" id="d-05-memory-hierarchy-root">
        <title id="05-memory-hierarchy-title">The GPU memory hierarchy</title>
        <desc id="05-memory-hierarchy-desc">From top to bottom: per-thread registers; per-block shared memory and L1 on each SM, up to 164 KB per SM on an A100; the read-only constant cache that broadcasts to a warp; the L2 cache shared by all SMs, where atomics are resolved; global memory in HBM at 1555 GB/s on an A100 with hundreds of cycles of latency; and host memory across PCIe at under a tenth of device bandwidth.</desc>
        <defs>
      <style>#d-05-memory-hierarchy-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-05-memory-hierarchy-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-05-memory-hierarchy-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-05-memory-hierarchy-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-05-memory-hierarchy-05-memory-hierarchy-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#d-05-memory-hierarchy-05-memory-hierarchy-dots)" opacity="0.55"/>
        <text x="24" y="52" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">FASTER · SMALLER</text>
        <line x1="64" y1="64" x2="64" y2="448" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
        <polygon points="60,64 68,64 64,56" fill="#4f5d75"/>
        <text x="24" y="472" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LARGER · SLOWER</text>
        <line x1="96" y1="64" x2="476" y2="64" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <rect x="96" y="64" width="380" height="64" fill="#ffffff"/>
        <line x1="96" y1="128" x2="476" y2="128" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="108" y="90" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">REG</text>
        <text x="196" y="92" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Registers</text>
        <text x="196" y="112" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">per thread · fastest</text>
        <rect x="96" y="128" width="380" height="64" fill="#bf4520" fill-opacity="0.08"/>
        <rect x="96" y="128" width="380" height="64" fill="none" stroke="#bf4520" stroke-width="1"/>
        <text x="108" y="154" fill="#bf4520" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600" letter-spacing="0.10em">SMEM</text>
        <text x="196" y="156" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Shared memory / L1</text>
        <text x="196" y="176" fill="#bf4520" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">per block · up to 164 KB per SM</text>
        <rect x="96" y="192" width="380" height="64" fill="#ececec"/>
        <line x1="96" y1="256" x2="476" y2="256" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="108" y="218" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">CONST</text>
        <text x="196" y="220" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Constant cache</text>
        <text x="196" y="240" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">read-only · warp broadcast</text>
        <rect x="96" y="256" width="380" height="64" fill="#ececec"/>
        <line x1="96" y1="320" x2="476" y2="320" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="108" y="282" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">L2</text>
        <text x="196" y="284" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">L2 cache</text>
        <text x="196" y="304" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">all SMs · atomics resolve here</text>
        <rect x="96" y="320" width="380" height="64" fill="#f5f5f5"/>
        <line x1="96" y1="384" x2="476" y2="384" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="108" y="346" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">HBM</text>
        <text x="196" y="348" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Global memory</text>
        <text x="196" y="368" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">A100: 1555 GB/s · 100s of cycles</text>
        <rect x="96" y="384" width="380" height="64" fill="#f5f5f5"/>
        <line x1="96" y1="448" x2="476" y2="448" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
        <text x="108" y="410" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.10em">HOST</text>
        <text x="196" y="412" fill="#2d3142" font-size="17" font-family="'Geist', system-ui, sans-serif" font-weight="600">Host memory</text>
        <text x="196" y="432" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">via PCIe · &lt;10% of HBM speed</text>
        <path d="M 488 72 H 496 V 248 H 488" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <text x="504" y="164" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">PER SM</text>
        <path d="M 488 264 H 496 V 376 H 488" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <text x="504" y="324" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">PER GPU</text>
        <path d="M 488 392 H 496 V 440 H 488" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <text x="504" y="420" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">OFF BOARD</text>
        <text x="24" y="512" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Tiling moves reused data up this stack; coalescing makes each trip down count.</text>
      </svg>
