<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 640 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="12-write-read-path-title 12-write-read-path-desc" id="d-12-write-read-path-root">
        <title id="12-write-read-path-title">Where the write path meets the read path</title>
        <desc id="12-write-read-path-desc">An unbundled dataflow from top to bottom: a user action becomes an immutable event with a request ID, is appended to the event log that serves as system of record, is turned by deterministic stream and batch processors into derived views such as indexes, caches and models, which are then queried or subscribed to and rendered on the client.</desc>
        <defs>
      <style>#d-12-write-read-path-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-12-write-read-path-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-12-write-read-path-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-12-write-read-path-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-12-write-read-path-12-write-read-path-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
        </defs>
