        <text x="504" y="356" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">READ PATH</text>
        <text x="24" y="512" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">Caches and indexes just move the boundary between the two paths.</text>
