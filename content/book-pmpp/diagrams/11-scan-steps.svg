        <rect x="210" y="184" width="25.3" height="28" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" stroke-width="1"/>
        <text x="243.29296875" y="203" fill="#2d3142" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">~74</text>
        <text x="196" y="262" fill="#bf4520" font-size="12" font-family="'Geist', system-ui, sans-serif" font-weight="600" text-anchor="end">Three-phase coarsened</text>
        <text x="196" y="277" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">64 threads, KS in phase 2</text>
        <rect x="210" y="248" width="24.6" height="28" fill="#f5f5f5"/>
        <rect x="210" y="248" width="24.6" height="28" fill="#bf4520" fill-opacity="0.12" stroke="#bf4520" stroke-width="1"/>
        <text x="242.609375" y="267" fill="#bf4520" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" font-weight="600">72</text>
        <text x="385" y="334" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ESTIMATED STEPS · 1024 ELEMENTS · 32 EXECUTION UNITS</text>
        <text x="24" y="368" fill="#4f5d75" font-size="13" font-family="'Instrument Serif', 'Noto Serif', serif" font-style="italic">With limited hardware, total work decides speed, not step count.</text>
      </svg>
